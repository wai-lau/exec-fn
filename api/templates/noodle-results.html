<main class="doc-card nd-card" id="noodle-results" data-slug="{{SLUG}}">
  <h1 class="nd-title">{{TITLE}}</h1>
  <p class="nd-dim"><span id="nd-count"></span> / <a href="/noodle/{{SLUG}}">vote</a></p>
  <div id="nd-cal" class="nd-cal-wrap"></div>
  <p class="nd-caption">brighter = more people free. each column of dots is one person: top dot midday, bottom dot night. tap a day for names.</p>
  <section id="nd-day" class="nd-day"></section>
  <h2 class="doc-h2">voters</h2>
  <ul id="nd-all" class="nd-voters"></ul>
</main>

<script src="/noodle-toggle.js?v=1"></script>
<script src="/noodle-seal.js?v=1"></script>
<script src="/noodle-cal.js?v=1"></script>
<script src="/noodle-cal-view.js?v=1"></script>
<script src="/noodle-results.js?v=1"></script>
