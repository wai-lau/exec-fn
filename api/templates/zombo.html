<!-- /zombo — the 1999 zombo.com Flash intro, and nothing else.

     #zb-flash is where Ruffle mounts the REAL movie, hotlinked from
     welcometozombo.com (that host sends `access-control-allow-origin: *`, so
     nothing copyrighted is mirrored into this repo).

     #zb-begin is the whole of the rest of the page: until the click it is white
     paper and one line, and the click reveals the movie and starts it WITH
     sound. There is no CSS reproduction underneath any more — if the movie
     cannot mount the line says so rather than drawing an imitation.

     Unlinked from the nav and the landing wheel on purpose. -->
<div id="zb-flash" aria-hidden="true">
  <canvas id="zb-bar-l" class="zb-bar"></canvas>
  <canvas id="zb-bar-r" class="zb-bar"></canvas>
</div>

<div id="zb-begin" class="zb-begin" role="button" tabindex="0"
     aria-label="click anywhere to begin the experience">
  <p class="zb-begin-copy" id="zb-begin-copy"></p>
</div>
