
<link rel="stylesheet" href="/rd.css?v=25">

<div id="reminders-bar" class="rd-reminders"></div>

<div class="rem-ov-modal" id="rem-overflow-modal" onclick="if(event.target===this)this.style.display='none'">
  <div class="rem-ov-box">
    <div class="rem-ov-hdr">
      <span>upcoming reminders</span>
      <button class="rem-ov-close" onclick="document.getElementById('rem-overflow-modal').style.display='none'">&times;</button>
    </div>
    <div class="rem-ov-list" id="rem-overflow-list"></div>
  </div>
</div>

<div class="hq-books" id="books-bar"></div>
<div class="book-ov-modal" id="book-overflow-modal" onclick="if(event.target===this)this.style.display='none'">
  <div class="book-ov-box">
    <div class="book-ov-hdr">
      <span>all books</span>
      <button class="book-ov-close" onclick="document.getElementById('book-overflow-modal').style.display='none'">&times;</button>
    </div>
    <div class="book-ov-list" id="book-overflow-list"></div>
  </div>
</div>

<!-- watermark lives OUTSIDE #rd-calendar: that element is position:fixed with a
     z-index, so a negative-z child of it can never sink below the CRT layers -->
<div id="cal-mark" class="cal-mark"></div>
<div id="rd-calendar"></div>

<div class="rd-board" id="board">
  <span style="padding:32px;font-family:'Iosevka Mayukai Monolite',monospace;font-size:0.8rem;opacity:0.4">loading...</span>
</div>
