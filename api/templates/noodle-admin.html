<main class="doc-card nd-card" id="noodle-admin">
  <h1 class="nd-title nd-brand">noodle</h1>
  <form id="nd-create" class="nd-create">
    <button type="submit" class="nd-submit">create poll</button>
    <div class="nd-dim nd-create-note">
      <p class="nd-create-note-head">end-to-end encrypted</p>
      <p><code>https://wai-lau.net/noodle/&lt;slug&gt;?t=&lt;token&gt;#k=&lt;K&gt;</code></p>
      <p>&lt;K&gt; is a secret key composed on your device</p>
      <p>data after the # is not sent to the server</p>
      <p>only people you send the full URL can access the poll</p>
      <p><a href="https://blog.excalidraw.com/end-to-end-encryption/" target="_blank" rel="noopener noreferrer">same scheme as excalidraw's end-to-end encryption</a></p>
    </div>
    <p id="nd-msg" class="nd-status"></p>
  </form>
</main>
