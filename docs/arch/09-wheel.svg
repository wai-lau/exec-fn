<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" font-family="monospace" font-size="12">
  <rect width="600" height="310" fill="#0d1117"/>
  <line x1="150" y1="20" x2="150" y2="280" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="156" y="16" fill="#8b949e">seam (theta = +90deg): cos = 0, fully transparent</text>
  <text x="156" y="296" fill="#8b949e">seam (theta = -90deg)</text>
  <g fill="#c9d1d9" stroke="#8b949e">
    <rect x="130" y="130" width="150" height="40" rx="4" fill="#238636" fill-opacity="1"/>
    <rect x="130" y="82" width="132" height="34" rx="4" fill="#238636" fill-opacity="0.75"/>
    <rect x="130" y="184" width="132" height="34" rx="4" fill="#238636" fill-opacity="0.75"/>
    <rect x="130" y="46" width="100" height="26" rx="4" fill="#238636" fill-opacity="0.4"/>
    <rect x="130" y="228" width="100" height="26" rx="4" fill="#238636" fill-opacity="0.4"/>
  </g>
  <text x="290" y="154" fill="#c9d1d9">front: theta = 0, scale 1, opacity 1</text>
  <text x="270" y="102" fill="#c9d1d9">+/- DTH: y = R sin(theta)</text>
  <text x="240" y="62" fill="#8b949e">rim: small, faint, blurred</text>
