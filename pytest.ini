[pytest]
# exec-fn's own suite + every app submodule's (apps/<name>/tests) + the
# sidecar's node suites (claude-box/tests). Lives at the
# root so `pytest` run from anywhere under /exec-fn -- including inside an app --
# finds this rootdir and the root conftest.py's fixtures. ARCHITECTURE.md §1e.
testpaths = tests apps/*/tests claude-box/tests
